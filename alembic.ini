# Developer convenience config. `siren init` runs migrations programmatically and does not need this.
# Usage:  alembic revision --autogenerate -m "describe change"   |   alembic upgrade head
# The database URL is taken from SIREN_DATABASE_URL (see .env.example).
[alembic]
script_location = src/siren_threatwatch/migrations
prepend_sys_path = src

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
